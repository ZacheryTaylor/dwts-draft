name: Fetch DWTS scores
on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 3"
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/fetch-scores.mjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Sync weekly DWTS scores"
          file_pattern: data/scores.json
